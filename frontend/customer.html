<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes"/>
  <title>बही खाता - Customer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Inter:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1a1209;
      --card: #2a1f0f;
      --card2: #241a0c;
      --border: #5a3e1b;
      --gold: #c9923f;
      --gold-light: #e8b96a;
      --text: #f0dfc0;
      --text-muted: #9a8060;
      --red: #e05555;
      --red-bg: #2d1010;
      --green: #4caf7d;
      --green-bg: #0d2518;
      --input-bg: #1f1608;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 8px 0 20px 0;
    }

    /* HEADER */
    .header {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      margin: 8px 10px 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .header-left { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }

    .back-btn {
      width: 38px; height: 38px;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text);
      transition: border-color 0.2s;
      flex-shrink: 0;
    }
    .back-btn:hover { border-color: var(--gold); color: var(--gold); }
    .back-btn svg { width: 18px; height: 18px; fill: currentColor; }

    .header-name {
      font-family: 'Tiro Devanagari Hindi', serif;
      font-size: 1.3rem;
      color: var(--gold-light);
      word-break: break-word;
    }

    .header-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 1px; }

    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .icon-btn {
      width: 36px; height: 36px;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--gold-light);
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .icon-btn:hover { border-color: var(--gold); }
    .icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* BALANCE CARDS */
    .balance-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 0 10px 14px;
    }

    .bal-card {
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }

    .bal-card.debit-card { border-color: rgba(224,85,85,0.4); background: rgba(45,16,16,0.6); }
    .bal-card.credit-card { border-color: rgba(76,175,125,0.4); background: rgba(13,37,24,0.6); }

    .bal-label {
      font-size: 0.6rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .bal-label.net { color: var(--text-muted); }
    .bal-label.debit { color: var(--red); }
    .bal-label.credit { color: var(--green); }

    .bal-amount {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .bal-amount.net { color: var(--text); }
    .bal-amount.debit { color: var(--red); }
    .bal-amount.credit { color: var(--green); }

    .bal-sub { font-size: 0.65rem; color: var(--text-muted); }
    .status-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .status-settled { background: rgba(201,146,63,0.15); color: var(--gold); border: 1px solid var(--gold); }
    .status-due { background: rgba(224,85,85,0.12); color: var(--red); border: 1px solid var(--red); }
    .status-advance { background: rgba(76,175,125,0.12); color: var(--green); border: 1px solid var(--green); }

    /* TRANSACTIONS */
    .tx-section {
      margin: 0 10px 20px;
      background: var(--card2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .tx-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px;
    }

    .tx-title {
      font-family: 'Tiro Devanagari Hindi', serif;
      font-size: 1rem;
      color: var(--gold-light);
    }

    .tx-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn {
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid;
      display: flex; align-items: center; gap: 4px;
      transition: all 0.15s;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
    }

    .btn-gold { background: var(--gold); color: #1a1209; border-color: var(--gold); }
    .btn-gold:hover { background: var(--gold-light); border-color: var(--gold-light); }

    .btn-outline { background: transparent; color: var(--text); border-color: var(--border); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

    /* TABLE */
    .tx-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
    .tx-table th {
      padding: 8px 6px;
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: left;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.1);
      white-space: nowrap;
    }
    .tx-table th.right { text-align: right; }
    .tx-table th.debit-col { color: var(--red); }
    .tx-table th.credit-col { color: var(--green); }
    .tx-table th.balance-col { color: var(--gold-light); }

    .tx-table td {
      padding: 8px 6px;
      font-size: 0.7rem;
      color: var(--text);
      border-bottom: 1px solid rgba(90,62,27,0.2);
      vertical-align: middle;
    }
    .tx-table tr:last-child td { border-bottom: none; }
    .tx-table tr:hover td { background: rgba(201,146,63,0.04); }

    .tx-table td.right { text-align: right; }
    .tx-table td.debit-amt { color: var(--red); font-weight: 600; text-align: right; white-space: nowrap; }
    .tx-table td.credit-amt { color: var(--green); font-weight: 600; text-align: right; white-space: nowrap; }
    .tx-table td.muted { color: var(--text-muted); font-size: 0.65rem; }

    /* RUNNING BALANCE */
    .tx-table td.balance-amt {
      text-align: right;
      font-weight: 700;
      font-size: 0.7rem;
      white-space: nowrap;
    }
    .tx-table td.balance-amt.due     { color: var(--red); }
    .tx-table td.balance-amt.advance { color: var(--green); }
    .tx-table td.balance-amt.settled { color: var(--text-muted); }

    .mode-badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 0.6rem;
      font-weight: 600;
      background: rgba(201,146,63,0.12);
      color: var(--gold);
      border: 1px solid rgba(201,146,63,0.3);
      white-space: nowrap;
    }

    .action-btns { display: flex; gap: 4px; flex-wrap: wrap; }

    .tbl-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.6rem;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      display: inline-flex; align-items: center; gap: 2px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tbl-btn:hover { border-color: var(--gold); color: var(--gold); }
    .tbl-btn.del:hover { border-color: var(--red); color: var(--red); }
    .tbl-btn svg { width: 10px; height: 10px; fill: currentColor; }

    .empty-tx {
      padding: 30px 12px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-tx p { font-size: 0.8rem; }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      align-items: center; justify-content: center;
      padding: 10px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px 14px;
      width: 100%; max-width: 720px;
      margin: 10px;
      position: relative;
      max-height: 95vh;
      overflow-y: auto;
    }

    .modal h3 {
      font-size: 1.1rem;
      color: var(--gold-light);
      margin-bottom: 16px;
      font-family: 'Tiro Devanagari Hindi', serif;
    }

    .modal-close {
      position: absolute; top: 10px; right: 14px;
      background: none; border: none;
      color: var(--text-muted); font-size: 1.2rem;
      cursor: pointer;
    }
    .modal-close:hover { color: var(--text); }

    .type-toggle {
      display: flex; gap: 8px; margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .type-btn {
      flex: 1;
      padding: 10px 8px;
      border-radius: 8px;
      border: 2px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: all 0.2s;
      min-width: 100px;
    }
    .type-btn.debit-btn.active {
      border-color: var(--red);
      background: rgba(224,85,85,0.1);
      color: var(--red);
    }
    .type-btn.credit-btn.active {
      border-color: var(--green);
      background: rgba(76,175,125,0.1);
      color: var(--green);
    }

    .form-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
    }
    .form-group { margin-bottom: 12px; }
    .form-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.8rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--gold); }
    .form-input::placeholder, .form-textarea::placeholder { color: var(--text-muted); }
    .form-select option { background: var(--card); }
    .form-textarea { resize: vertical; min-height: 60px; }

    .modal-footer {
      display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;
      flex-wrap: wrap;
    }

    /* ITEMS TABLE */
    .items-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
    .items-table th {
      padding: 4px 3px;
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      border-bottom: 2px solid var(--border);
    }
    .items-table td {
      padding: 3px;
      border-bottom: 1px solid rgba(90,62,27,0.15);
      vertical-align: middle;
    }
    .items-table input {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 5px;
      color: var(--text);
      font-size: 0.7rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      min-width: 40px;
    }
    .items-table input:focus { border-color: var(--gold); }
    .items-table input.item-name { min-width: 70px; }
    .items-table input.item-rate { max-width: 70px; text-align: center; }
    .items-table input.item-qty { min-width: 70px; }
    .items-table .item-total {
      font-weight: 600;
      color: var(--gold);
      text-align: center;
      font-size: 0.7rem;
      min-width: 50px;
    }
    .items-table .add-row-btn {
      width: 100%;
      padding: 6px;
      background: transparent;
      border: 1.5px dashed var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.7rem;
      transition: all 0.2s;
    }
    .items-table .add-row-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .items-table .remove-item {
      background: transparent;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0 4px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .items-table .remove-item:hover { background: rgba(224,85,85,0.1); }
    .items-table .grand-total-row td {
      padding: 6px 3px;
      border-top: 2px solid var(--border);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .items-table .grand-total-label { text-align: right; color: var(--text-muted); }
    .items-table .grand-total-value { color: var(--gold); text-align: center; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1.5px solid var(--green);
      border-radius: 10px;
      padding: 10px 18px;
      color: var(--green);
      font-size: 0.8rem;
      display: flex; align-items: center; gap: 8px;
      z-index: 999;
      opacity: 0;
      transition: all 0.3s ease;
      max-width: 92%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { border-color: var(--red); color: var(--red); }

    /* CONFIRM */
    .confirm-box { max-width: 360px; }
    .confirm-box h3 { margin-bottom: 6px; }
    .confirm-box p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px; }
    .btn-danger { background: var(--red); color: #fff; border-color: var(--red); }
    .btn-danger:hover { opacity: 0.85; }

    /* SCROLLBAR */
    .modal::-webkit-scrollbar { width: 4px; }
    .modal::-webkit-scrollbar-track { background: var(--bg); border-radius: 2px; }
    .modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .form-select:disabled { opacity: 0.6; cursor: not-allowed; }

    /* PRINT MODAL HELPERS */
    .print-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: -6px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    #printRangeFields { display: none; }

    /* RESPONSIVE FINE-TUNE */
    @media (max-width: 600px) {
      .header { padding: 10px 12px; margin: 6px 8px 10px; }
      .header-name { font-size: 1.1rem; }
      .back-btn, .icon-btn { width: 34px; height: 34px; }
      .balance-row { grid-template-columns: 1fr; gap: 8px; }
      .bal-card { padding: 10px 12px; }
      .bal-amount { font-size: 1.1rem; }
      .tx-header { padding: 10px 12px; }
      .tx-title { font-size: 0.9rem; }
      .btn { font-size: 0.65rem; padding: 4px 8px; }
      .tx-table { font-size: 0.6rem; }
      .tx-table th, .tx-table td { padding: 5px 4px; }
      .tx-table td { font-size: 0.6rem; }
      .tx-table td.balance-amt { font-size: 0.6rem; }
      .mode-badge { font-size: 0.5rem; padding: 1px 5px; }
      .tbl-btn { font-size: 0.55rem; padding: 1px 4px; }
      .modal { padding: 14px 10px; max-width: 100%; margin: 6px; }
      .form-row { grid-template-columns: 1fr; gap: 6px; }
      .type-toggle { flex-direction: row; }
      .type-btn { font-size: 0.65rem; padding: 6px 4px; min-width: 70px; }
      .items-table { font-size: 0.6rem; }
      .items-table input { font-size: 0.6rem; padding: 3px 4px; }
      .items-table input.item-rate { max-width: 55px; }
      .items-table input.item-qty { min-width: 55px; }
      .items-table .item-total { font-size: 0.6rem; min-width: 40px; }
      .items-table .grand-total-row td { font-size: 0.7rem; }
      .modal h3 { font-size: 0.95rem; }
      .toast { font-size: 0.7rem; padding: 8px 14px; bottom: 12px; }
      .header-actions .icon-btn svg { width: 14px; height: 14px; }
    }

    @media (max-width: 400px) {
      .header-name { font-size: 0.95rem; }
      .tx-table th, .tx-table td { padding: 3px 2px; }
      .tx-table td { font-size: 0.55rem; }
      .tx-table td.balance-amt { font-size: 0.55rem; }
      .bal-amount { font-size: 1rem; }
      .bal-card { padding: 8px 10px; }
      .items-table input.item-rate { max-width: 45px; }
      .items-table input.item-qty { min-width: 45px; }
      .items-table .item-total { min-width: 35px; font-size: 0.55rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div>
        <div class="header-name" id="customerNameHeader">—</div>
        <div class="header-sub">Ledger</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" title="Print" onclick="openPrintPage()">
        <svg viewBox="0 0 24 24"><path d="M6 9V2h12v7h2a2 2 0 012 2v6h-4v5H6v-5H2v-6a2 2 0 012-2h2zm2-5v5h8V4H8zm8 16v-5H8v5h8zm2-9a1 1 0 100 2 1 1 0 000-2z"/></svg>
      </button>
      <button class="icon-btn" title="Backup" onclick="downloadBackup()">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </button>
      <button class="icon-btn" title="WhatsApp" onclick="shareWhatsApp()">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      </button>
    </div>
  </div>

  <!-- BALANCE -->
  <div class="balance-row" id="balanceCards"></div>

  <!-- TRANSACTIONS -->
  <div class="tx-section">
    <div class="tx-header">
      <div class="tx-title">Transactions</div>
      <div class="tx-actions">
        <button class="btn btn-gold" onclick="openAddEntry()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          Add
        </button>
      </div>
    </div>
    <div id="txTableWrap"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="entryModal">
    <div class="modal">
      <button class="modal-close" onclick="closeEntry()">✕</button>
      <h3 id="entryModalTitle">Add Transaction</h3>

      <div class="type-toggle">
        <button class="type-btn debit-btn active" id="debitBtn" onclick="setType('debit')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg>
          DEBIT (Udhaar)
        </button>
        <button class="type-btn credit-btn" id="creditBtn" onclick="setType('credit')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
          CREDIT (Payment)
        </button>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input class="form-input" type="date" id="entryDate"/>
        </div>
        <div class="form-group">
          <label class="form-label">Payment Mode</label>
          <select class="form-select" id="entryMode">
            <option>Udhaar</option>
            <option>Cash</option>
            <option>UPI</option>
            <option>Bank Transfer</option>
            <option>Cheque</option>
            <option>Credit</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Items (rate & qty)</label>
        <div style="overflow-x:auto; -webkit-overflow-scrolling: touch;">
          <table class="items-table" id="itemsTable">
            <thead>
              <tr>
                <th style="width:30px;">#</th>
                <th style="min-width:80px;">Item</th>
                <th style="width:70px;">Rate ₹</th>
                <th style="min-width:70px;">Qty</th>
                <th style="width:60px;">Total</th>
                <th style="width:30px;"></th>
              </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
            <tfoot>
              <tr><td colspan="6" style="padding:6px 3px;">
                <button type="button" class="add-row-btn" onclick="addItemRow()">+ Add Item</button>
              </td></tr>
              <tr class="grand-total-row">
                <td colspan="4" class="grand-total-label">Grand Total</td>
                <td class="grand-total-value" id="grandTotal">₹0.00</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Remarks</label>
        <textarea class="form-textarea" id="entryRemarks" placeholder="Optional..."></textarea>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeEntry()">Cancel</button>
        <button class="btn btn-gold" onclick="saveEntry()">Save</button>
      </div>
    </div>
  </div>

  <!-- CONFIRM -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal confirm-box">
      <h3>Delete Entry?</h3>
      <p>Are you sure? This action cannot be undone.</p>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDeleteEntry()">Delete</button>
      </div>
    </div>
  </div>

  <!-- PRINT OPTIONS MODAL -->
  <div class="modal-overlay" id="printModal">
    <div class="modal confirm-box" style="max-width:440px;">
      <button class="modal-close" onclick="closePrintModal()">✕</button>
      <h3>Print Options</h3>
      <p class="print-hint">Choose what to include in the printed statement.</p>

      <div class="type-toggle">
        <button class="type-btn debit-btn active" id="printFullBtn" onclick="setPrintMode('full')">
          📄 Full Ledger
        </button>
        <button class="type-btn credit-btn" id="printRangeBtn" onclick="setPrintMode('range')">
          📅 Date Range
        </button>
      </div>

      <div id="printRangeFields">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">From Date</label>
            <input class="form-input" type="date" id="printFromDate"/>
          </div>
          <div class="form-group">
            <label class="form-label">To Date</label>
            <input class="form-input" type="date" id="printToDate"/>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closePrintModal()">Cancel</button>
        <button class="btn btn-gold" onclick="confirmPrint()">🖨 Print</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    <span id="toastMsg"></span>
  </div>

  <script src="api.js"></script>
  <script>
    if (sessionStorage.getItem('bk_auth') !== 'true') window.location.href = 'index.html';

    const params = new URLSearchParams(window.location.search);
    const customerId = params.get('id');
    if (!customerId) window.location.href = 'dashboard.html';

    let editEntryId = null;
    let deleteEntryId = null;
    let currentType = 'debit';
    let itemCounter = 0;
    let printMode = 'full';

    let appData = { customers: [] };
    let customer = null;

    function formatAmount(n) {
      return '₹' + Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDate(d) {
      if (!d) return '—';
      const dt = new Date(d);
      if (isNaN(dt.getTime())) return '—';
      return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function todayISO() {
      return new Date().toISOString().split('T')[0];
    }

    function getBalance(cust) {
      const entries = cust.entries || [];
      const opening = Number(cust.openingBalance || 0); // + = due, - = advance
      const debit  = entries.filter(e => e.type === 'debit')
                            .reduce((s, e) => s + Number(e.amount || 0), 0);
      const credit = entries.filter(e => e.type === 'credit')
                            .reduce((s, e) => s + Number(e.amount || 0), 0);
      return { debit, credit, net: opening + debit - credit, opening };
    }

    // ---------- LOAD ----------
    async function loadData() {
      try {
        appData = await apiGetData();
        customer = (appData.customers || []).find(c => c.id === customerId);
        if (!customer) {
          document.getElementById('customerNameHeader').textContent = 'Not found';
          return;
        }
        document.getElementById('customerNameHeader').textContent = customer.name || 'Customer';
        renderBalance();
        renderTransactions();
      } catch (err) {
        console.error(err);
        showToast('Failed to load data', true);
      }
    }

    // ---------- BALANCE RENDER ----------
    function renderBalance() {
      const bal = getBalance(customer);
      let statusClass = 'status-settled';
      let statusText = 'Settled';
      if (bal.net > 0) { statusClass = 'status-due'; statusText = 'Due'; }
      else if (bal.net < 0) { statusClass = 'status-advance'; statusText = 'Advance'; }

      document.getElementById('balanceCards').innerHTML = `
        <div class="bal-card">
          <div class="bal-label net">Net Balance</div>
          <div class="bal-amount net">${formatAmount(bal.net)}</div>
          <span class="status-badge ${statusClass}">${statusText}</span>
        </div>
        <div class="bal-card debit-card">
          <div class="bal-label debit">Total Debit (Udhaar)</div>
          <div class="bal-amount debit">${formatAmount(bal.debit)}</div>
          <div class="bal-sub">${(customer.entries || []).filter(e => e.type === 'debit').length} entries</div>
        </div>
        <div class="bal-card credit-card">
          <div class="bal-label credit">Total Credit (Payment)</div>
          <div class="bal-amount credit">${formatAmount(bal.credit)}</div>
          <div class="bal-sub">${(customer.entries || []).filter(e => e.type === 'credit').length} entries</div>
        </div>
      `;
    }

    // ---------- TRANSACTIONS RENDER (with running balance) ----------
    function renderTransactions() {
      // chronological order (purana pehle) — running balance ke liye
      const entriesChrono = (customer.entries || []).slice()
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      // running balance calculate (opening balance se start)
      let running = Number(customer.openingBalance || 0);
      const withBalance = entriesChrono.map(e => {
        const amt = Number(e.amount || 0);
        if (e.type === 'debit') running += amt;
        else running -= amt;
        return { ...e, runningBalance: running };
      });

      // display ke liye latest first
      const entries = withBalance.slice().reverse();

      const wrap = document.getElementById('txTableWrap');

      if (!entries.length) {
        wrap.innerHTML = `<div class="empty-tx"><p>No transactions yet.</p></div>`;
        return;
      }

      let rows = '';
      entries.forEach(e => {
        let particular = '';
        if (e.items && e.items.length) {
          particular = e.items.map(it => {
            const qty = it.qtyDisplay || `${it.qty}${it.unit || ''}`;
            return `<div>${it.name} (${qty} × ₹${Number(it.rate || 0).toFixed(2)})</div>`;
          }).join('');
        } else {
          particular = e.particular || '—';
        }
        const remarks = e.remarks || e.note || e.comment || '';

        // running balance ka color + text
        const rbClass = e.runningBalance > 0 ? 'due'
                      : e.runningBalance < 0 ? 'advance' : 'settled';
        const rbText = Math.abs(e.runningBalance) === 0
                      ? '₹0.00'
                      : formatAmount(e.runningBalance) +
                        (e.runningBalance > 0 ? ' Due' : ' Adv');

        rows += `
          <tr>
            <td>${formatDate(e.date)}</td>
            <td>${particular}${remarks ? `<div class="muted">${remarks}</div>` : ''}</td>
            <td><span class="mode-badge">${e.mode || '—'}</span></td>
            <td class="debit-amt">${e.type === 'debit' ? formatAmount(e.amount) : '—'}</td>
            <td class="credit-amt">${e.type === 'credit' ? formatAmount(e.amount) : '—'}</td>
            <td class="balance-amt ${rbClass}">${rbText}</td>
            <td>
              <div class="action-btns">
                <button class="tbl-btn" onclick="editEntry('${e.id}')">
                  <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                  Edit
                </button>
                <button class="tbl-btn del" onclick="askDelete('${e.id}')">
                  <svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                  Del
                </button>
              </div>
            </td>
          </tr>
        `;
      });

      wrap.innerHTML = `
        <div style="overflow-x:auto; -webkit-overflow-scrolling: touch;">
          <table class="tx-table">
            <thead>
              <tr>
                <th style="min-width:80px;">Date</th>
                <th>Particular</th>
                <th style="min-width:70px;">Mode</th>
                <th class="right debit-col" style="min-width:80px;">Debit</th>
                <th class="right credit-col" style="min-width:80px;">Credit</th>
                <th class="right balance-col" style="min-width:90px;">Balance</th>
                <th style="min-width:90px;">Action</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    // ---------- ENTRY MODAL ----------
    function openAddEntry() {
      editEntryId = null;
      currentType = 'debit';
      document.getElementById('entryModalTitle').textContent = 'Add Transaction';
      document.getElementById('entryDate').value = todayISO();
      document.getElementById('entryMode').value = 'Udhaar';
      document.getElementById('entryRemarks').value = '';
      document.getElementById('itemsBody').innerHTML = '';
      itemCounter = 0;
      addItemRow();
      setType('debit');
      updateGrandTotal();
      document.getElementById('entryModal').classList.add('open');
    }

    function editEntry(id) {
      const e = (customer.entries || []).find(x => x.id === id);
      if (!e) return;
      editEntryId = id;
      currentType = e.type;
      document.getElementById('entryModalTitle').textContent = 'Edit Transaction';
      document.getElementById('entryDate').value = e.date ? String(e.date).slice(0, 10) : todayISO();
      document.getElementById('entryMode').value = e.mode || 'Udhaar';
      document.getElementById('entryRemarks').value = e.remarks || e.note || e.comment || '';
      document.getElementById('itemsBody').innerHTML = '';
      itemCounter = 0;
      if (e.items && e.items.length) {
        e.items.forEach(it => addItemRow(it.name, it.rate, it.qty));
      } else {
        addItemRow(e.particular || '', e.amount, 1);
      }
      setType(currentType);
      updateGrandTotal();
      document.getElementById('entryModal').classList.add('open');
    }

    function closeEntry() {
      document.getElementById('entryModal').classList.remove('open');
    }

    function setType(t) {
      currentType = t;
      const db = document.getElementById('debitBtn');
      const cb = document.getElementById('creditBtn');
      if (t === 'debit') {
        db.classList.add('active');
        cb.classList.remove('active');
      } else {
        cb.classList.add('active');
        db.classList.remove('active');
      }
    }

    function addItemRow(name = '', rate = '', qty = '') {
      itemCounter++;
      const id = 'item_' + itemCounter;
      const tr = document.createElement('tr');
      tr.id = id;
      tr.innerHTML = `
        <td style="text-align:center;" class="row-num"></td>
        <td><input class="item-name" type="text" placeholder="Item" value="${name || ''}"/></td>
        <td><input class="item-rate" type="number" min="0" step="0.01" placeholder="0" value="${rate || ''}" oninput="updateGrandTotal()"/></td>
        <td><input class="item-qty" type="text" placeholder="1" value="${qty || ''}" oninput="updateGrandTotal()"/></td>
        <td class="item-total">₹0.00</td>
        <td><button class="remove-item" onclick="removeItemRow('${id}')">✕</button></td>
      `;
      document.getElementById('itemsBody').appendChild(tr);
      renumberRows();
      updateGrandTotal();
    }

    function removeItemRow(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
      if (!document.getElementById('itemsBody').children.length) addItemRow();
      renumberRows();
      updateGrandTotal();
    }

    function renumberRows() {
      const rows = document.getElementById('itemsBody').children;
      for (let i = 0; i < rows.length; i++) {
        rows[i].querySelector('.row-num').textContent = i + 1;
      }
    }

    function parseQty(q) {
      if (q === undefined || q === null || q === '') return 1;
      const n = parseFloat(String(q).replace(/[^0-9.\-]/g, ''));
      return isNaN(n) ? 1 : n;
    }

    function updateGrandTotal() {
      const rows = document.getElementById('itemsBody').children;
      let total = 0;
      for (const row of rows) {
        const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
        const qty = parseQty(row.querySelector('.item-qty').value);
        const lineTotal = rate * qty;
        row.querySelector('.item-total').textContent = formatAmount(lineTotal);
        total += lineTotal;
      }
      document.getElementById('grandTotal').textContent = formatAmount(total);
    }

    // ---------- SAVE ----------
    async function saveEntry() {
      const date = document.getElementById('entryDate').value;
      if (!date) { showToast('Please select a date', true); return; }

      const mode = document.getElementById('entryMode').value;
      const remarks = document.getElementById('entryRemarks').value.trim();

      const rows = document.getElementById('itemsBody').children;
      const items = [];
      let total = 0;

      for (const row of rows) {
        const name = row.querySelector('.item-name').value.trim();
        const rate = parseFloat(row.querySelector('.item-rate').value) || 0;
        const qtyRaw = row.querySelector('.item-qty').value;
        const qty = parseQty(qtyRaw);
        if (!name && !rate) continue;
        const lineTotal = rate * qty;
        total += lineTotal;
        items.push({
          name: name || 'Item',
          rate,
          qty,
          qtyDisplay: qtyRaw || String(qty),
          total: lineTotal
        });
      }

      if (!items.length) {
        showToast('Please add at least one item', true);
        return;
      }
      if (total <= 0) {
        showToast('Total must be greater than 0', true);
        return;
      }

      const entry = {
        id: editEntryId || ('e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7)),
        type: currentType,
        date,
        mode,
        remarks,
        items,
        amount: total,
        particular: items.map(i => i.name).join(', ')
      };

      try {
        if (editEntryId) {
          const idx = customer.entries.findIndex(x => x.id === editEntryId);
          if (idx > -1) customer.entries[idx] = entry;
        } else {
          customer.entries = customer.entries || [];
          customer.entries.push(entry);
        }

        await apiSaveData(appData);
        closeEntry();
        renderBalance();
        renderTransactions();
        showToast(editEntryId ? 'Entry updated' : 'Entry added');
      } catch (err) {
        console.error(err);
        showToast('Save failed', true);
      }
    }

    // ---------- DELETE ----------
    function askDelete(id) {
      deleteEntryId = id;
      document.getElementById('confirmModal').classList.add('open');
    }
    function closeConfirm() {
      deleteEntryId = null;
      document.getElementById('confirmModal').classList.remove('open');
    }
    async function confirmDeleteEntry() {
      if (!deleteEntryId) return;
      try {
        customer.entries = (customer.entries || []).filter(e => e.id !== deleteEntryId);
        await apiSaveData(appData);
        closeConfirm();
        renderBalance();
        renderTransactions();
        showToast('Entry deleted');
      } catch (err) {
        console.error(err);
        showToast('Delete failed', true);
      }
    }

    // ---------- PRINT MODAL ----------
    function openPrintPage() {
      printMode = 'full';
      setPrintMode('full');
      document.getElementById('printFromDate').value = '';
      document.getElementById('printToDate').value = '';
      document.getElementById('printModal').classList.add('open');
    }
    function closePrintModal() {
      document.getElementById('printModal').classList.remove('open');
    }
    function setPrintMode(m) {
      printMode = m;
      const fb = document.getElementById('printFullBtn');
      const rb = document.getElementById('printRangeBtn');
      const rf = document.getElementById('printRangeFields');
      if (m === 'full') {
        fb.classList.add('active');
        rb.classList.remove('active');
        rf.style.display = 'none';
      } else {
        rb.classList.add('active');
        fb.classList.remove('active');
        rf.style.display = 'block';
      }
    }
    function confirmPrint() {
      let url = `print.html?id=${encodeURIComponent(customerId)}`;
      if (printMode === 'range') {
        const from = document.getElementById('printFromDate').value;
        const to = document.getElementById('printToDate').value;
        if (!from || !to) { showToast('Please select both dates', true); return; }
        if (from > to) { showToast('From date cannot be after To date', true); return; }
        url += `&from=${from}&to=${to}`;
      }
      window.open(url, '_blank');
      closePrintModal();
    }

    // ---------- BACKUP ----------
    function downloadBackup() {
      try {
        const data = JSON.stringify(customer, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ledger_${(customer.name || 'customer').replace(/\s+/g, '_')}_${todayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Backup downloaded');
      } catch (err) {
        console.error(err);
        showToast('Backup failed', true);
      }
    }

    // ---------- WHATSAPP ----------
    function shareWhatsApp() {
      const bal = getBalance(customer);
      let msg = `*${customer.name}*\nLedger Summary\n`;
      msg += `Debit: ${formatAmount(bal.debit)}\n`;
      msg += `Credit: ${formatAmount(bal.credit)}\n`;
      msg += `Net: ${formatAmount(bal.net)}`;
      if (bal.net > 0) msg += ' (Due)';
      else if (bal.net < 0) msg += ' (Advance)';
      const url = 'https://wa.me/?text=' + encodeURIComponent(msg);
      window.open(url, '_blank');
    }

    // ---------- TOAST ----------
    let toastTimer = null;
    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      t.classList.toggle('error', !!isError);
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    // ---------- NAV ----------
    function goBack() {
      window.location.href = 'dashboard.html';
    }

    // ---------- INIT ----------
    loadData();
  </script>
</body>
</html>
