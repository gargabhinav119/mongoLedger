<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>बही खाता - Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Inter:wght@300;400;500;600&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#1a1209; --card:#2a1f0f; --border:#5a3e1b;
      --gold:#c9923f; --gold-light:#e8b96a;
      --text:#f0dfc0; --text-muted:#9a8060;
      --red:#e05555; --input-bg:#1f1608;
    }
    body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
    .logo-wrap { display:flex; flex-direction:column; align-items:center; margin-bottom:36px; }
    .logo-icon { width:80px; height:80px; border:2.5px solid var(--gold); border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:14px; background:var(--card); }
    .logo-icon svg { width:40px; height:40px; fill:var(--gold); }
    .logo-title { font-family:'Tiro Devanagari Hindi',serif; font-size:2.4rem; color:var(--gold-light); }
    .logo-sub { font-size:0.9rem; color:var(--text-muted); margin-top:4px; }
    .card { background:var(--card); border:1.5px solid var(--border); border-radius:14px; padding:40px 44px; width:100%; max-width:460px; }
    .card h2 { font-size:1.5rem; color:var(--gold-light); text-align:center; margin-bottom:6px; font-family:'Tiro Devanagari Hindi',serif; }
    .card p { text-align:center; color:var(--text-muted); font-size:0.88rem; margin-bottom:30px; }
    .field-label { display:flex; align-items:center; gap:7px; font-size:0.88rem; font-weight:600; color:var(--text); margin-bottom:8px; }
    .input-row { display:flex; gap:10px; margin-bottom:6px; }
    .prefix { background:var(--input-bg); border:1.5px solid var(--border); border-radius:8px; padding:0 14px; color:var(--text); font-size:0.95rem; display:flex; align-items:center; }
    input { width:100%; background:var(--input-bg); border:1.5px solid var(--border); border-radius:8px; padding:12px 16px; color:var(--text); font-size:0.95rem; font-family:'Inter',sans-serif; outline:none; transition:border-color 0.2s; }
    input:focus { border-color:var(--gold); }
    input::placeholder { color:var(--text-muted); }
    .hint { color:var(--text-muted); font-size:0.8rem; margin-bottom:20px; }
    .field-group { margin-bottom:20px; }
    .btn-primary { width:100%; background:var(--gold); color:#1a1209; border:none; border-radius:9px; padding:14px; font-size:1rem; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:all 0.15s; margin-top:10px; }
    .btn-primary:hover { background:var(--gold-light); }
    .btn-primary:active { transform:scale(0.98); }
    .error-msg { background:rgba(224,85,85,0.12); border:1px solid var(--red); border-radius:8px; padding:10px 14px; color:var(--red); font-size:0.85rem; margin-top:14px; display:none; text-align:center; }
    .footer-note { margin-top:28px; display:flex; align-items:center; gap:8px; color:var(--text-muted); font-size:0.8rem; }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M4 2h16a1 1 0 011 1v18a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1zm1 2v16h14V4H5zm2 3h10v1.5H7V7zm0 3.5h10V12H7v-1.5zm0 3.5h7v1.5H7V14z"/></svg>
    </div>
    <div class="logo-title">बही खाता</div>
    <div class="logo-sub">Traditional Shopkeeper's Ledger</div>
  </div>

  <div class="card">
    <h2>Shop Login</h2>
    <p>Apna phone number aur password darj karein</p>

    <div class="field-group">
      <div class="field-label">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="var(--gold)"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        Phone Number
      </div>
      <div class="input-row">
        <div class="prefix">+91</div>
        <input type="tel" id="phone" placeholder="9876543210" maxlength="10"/>
      </div>
      <div class="hint">10-digit mobile number darj karein</div>
    </div>

    <div class="field-group">
      <div class="field-label">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="var(--gold)"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        Password
      </div>
      <input type="password" id="password" placeholder="••••" maxlength="20"/>
    </div>

    <button class="btn-primary" onclick="doLogin()">Login &nbsp;→</button>
    <div class="error-msg" id="errorMsg">❌ Galat phone number ya password. Dobara try karein.</div>
  </div>

  <div class="footer-note">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="var(--text-muted)"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
    Aapka data secure hai
  </div>

  <script src="api.js"></script>
  <script>
    // Check if already logged in
    if (sessionStorage.getItem('bk_token')) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value.trim();
      const err = document.getElementById('errorMsg');

      if (!phone || !password) {
        err.textContent = '❌ Phone aur password dono darj karein';
        err.style.display = 'block';
        setTimeout(() => err.style.display = 'none', 3000);
        return;
      }

      try {
        const result = await apiShopLogin(phone, password);
        if (result.success && result.token) {
          sessionStorage.setItem('bk_token', result.token);
          sessionStorage.setItem('bk_shopId', result.shop.id);
          sessionStorage.setItem('bk_shopName', result.shop.shopName);
          sessionStorage.setItem('bk_auth', 'true');
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        err.textContent = '❌ ' + error.message;
        err.style.display = 'block';
        setTimeout(() => err.style.display = 'none', 3000);
      }
    }
  </script>
</body>
</html>
